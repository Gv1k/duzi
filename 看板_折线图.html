<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>肚子说了算 · 数据看板</title>
  <style>
    :root{
      --bg:#f6fbff;
      --card:#ffffff;
      --text:#1f2a37;
      --sub:#6b7280;
      --primary:#3b82f6;
      --primary2:#8b5cf6;
      --good:#10b981;
      --amber:#f59e0b;
      --shadow:0 10px 30px rgba(59,130,246,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      background:linear-gradient(180deg,#f8fcff 0%,#f4f9ff 100%);
      color:var(--text);
    }
    .wrap{
      max-width:1040px;
      margin:0 auto;
      padding:28px 16px 40px;
    }
    .title{
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      margin-bottom:18px;
    }
    h1{
      margin:0;font-size:26px;letter-spacing:.2px;
    }
    .sub{
      color:var(--sub);font-size:14px;margin-top:4px;
    }
    .btn{
      border:none;background:var(--primary);color:#fff;
      padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:600;
      box-shadow:var(--shadow);
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:14px;
    }
    @media (max-width:900px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
    @media (max-width:560px){ .grid{grid-template-columns:1fr;} }
    .card{
      background:var(--card);
      border-radius:var(--radius);
      padding:18px 16px;
      box-shadow:var(--shadow);
      border:1px solid #eaf2ff;
    }
    .label{
      color:var(--sub);font-size:13px;margin-bottom:8px;
    }
    .value{
      font-size:32px;font-weight:800;line-height:1.2;
      letter-spacing:.3px;
    }
    .ok{color:var(--good)}
    .section{
      margin-top:16px;
      background:#fff;border:1px solid #eaf2ff;border-radius:var(--radius);
      box-shadow:var(--shadow);padding:20px 20px 16px;
    }
    .section-head{
      display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
      margin-bottom:6px;
    }
    .section h2{
      margin:0;font-size:17px;
    }
    .legend{
      display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);
    }
    .legend span{
      display:inline-flex;align-items:center;gap:6px;
    }
    .dot{
      width:9px;height:9px;border-radius:50%;display:inline-block;
    }
    .chart-wrap{
      width:100%;overflow-x:auto;
    }
    .insight{
      margin-top:8px;font-size:13px;color:#2563eb;background:#eef6ff;
      border-radius:10px;padding:8px 12px;display:none;
    }
    .muted{color:var(--sub)}
    .err{
      margin-top:12px;background:#fff2f2;color:#b91c1c;border:1px solid #fecaca;
      border-radius:12px;padding:10px 12px;font-size:13px;display:none;
      white-space:pre-wrap;
    }
    .warn{
      margin-top:12px;background:#fffaf0;color:#92640a;border:1px solid #fde3a7;
      border-radius:12px;padding:10px 12px;font-size:13px;display:none;
      white-space:pre-wrap;
    }
    .foot{
      margin-top:10px;color:var(--sub);font-size:12px;
    }
    .pill{
      display:inline-block;padding:4px 8px;border-radius:999px;
      background:#eef6ff;color:#2563eb;font-size:12px;font-weight:700;
    }
    .empty-chart{
      padding:40px 0;text-align:center;color:var(--sub);font-size:13px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="wrap">
    <div class="title">
      <div>
        <h1>📊 肚子说了算 · 数据看板</h1>
        <div class="sub" id="lastUpdated">加载中...</div>
      </div>
      <button class="btn" id="refreshBtn">刷新数据</button>
    </div>

    <div class="grid">
      <div class="card">
        <div class="label">今日 UV（DAU）</div>
        <div class="value" id="dauToday">--</div>
      </div>
      <div class="card">
        <div class="label">今日 PV</div>
        <div class="value" id="pvToday">--</div>
      </div>
      <div class="card">
        <div class="label">累计用户（总 UV）</div>
        <div class="value ok" id="totalUsers">--</div>
      </div>
      <div class="card">
        <div class="label">截至昨日累计用户</div>
        <div class="value" id="totalUntilYesterday">--</div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>最近 7 天趋势</h2>
        <div class="legend">
          <span><i class="dot" style="background:#3b82f6"></i>UV（去重用户）</span>
          <span><i class="dot" style="background:#f59e0b"></i>PV（访问次数）</span>
        </div>
      </div>
      <div class="chart-wrap" id="trendChart"></div>
      <div class="foot">UV=distinct user_id，PV=count(*)，按自然日统计，鼠标悬停圆点可查看具体数值。</div>
      <div class="warn" id="warnBox"></div>
      <div class="err" id="errorBox"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>累计用户增长</h2>
        <span class="pill" id="growthPill">--</span>
      </div>
      <div class="chart-wrap" id="growthChart"></div>
      <div class="foot">按用户首次出现的日期计入新增，曲线为累计去重用户总数。</div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>访问时段分布</h2>
        <span class="pill">全部历史数据 · 按小时</span>
      </div>
      <div class="chart-wrap" id="hourChart"></div>
      <div class="insight" id="hourInsight"></div>
      <div class="foot">统计全部访问记录发生的本地小时，用于观察用户实际使用产品的时间规律。</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://bxqkvbvjyszzfhmtrpra.supabase.co";
    const SUPABASE_KEY = "sb_publishable_RJMMiyXCR0bsqKcsutU_HQ_OwS4BkAR";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = (id) => document.getElementById(id);
    const fmt = (n) => (n ?? 0).toLocaleString("zh-CN");
    const userFieldCandidates = ["user_id", "userId", "uid", "visitor_id", "visitorId"];
    const timeFieldCandidates = ["visited_at", "created_at", "inserted_at", "timestamp", "time", "date"];
    // 实际表结构确认为: id, user_id, visited_at（与上面候选列表已经匹配，无需改字段名）

    function showErr(msg) {
      const box = $("errorBox");
      box.style.display = "block";
      box.textContent = msg;
    }
    function clearErr() {
      const box = $("errorBox");
      box.style.display = "none";
      box.textContent = "";
    }
    function showWarn(msg) {
      const box = $("warnBox");
      box.style.display = "block";
      box.textContent = msg;
    }
    function clearWarn() {
      const box = $("warnBox");
      box.style.display = "none";
      box.textContent = "";
    }

    function getLocalDayKey(dateValue) {
      const d = new Date(dateValue);
      if (Number.isNaN(d.getTime())) return null;
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function getDayRangeLocal(offsetDays = 0) {
      const now = new Date();
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + offsetDays, 0, 0, 0, 0);
      const next = new Date(d);
      next.setDate(next.getDate() + 1);
      return { start: d.toISOString(), end: next.toISOString(), label: getLocalDayKey(d) };
    }

    function pickField(row, candidates) {
      if (!row) return null;
      for (const key of candidates) {
        if (Object.prototype.hasOwnProperty.call(row, key) && row[key] !== null && row[key] !== undefined && String(row[key]).trim() !== "") {
          return key;
        }
      }
      return null;
    }

    function getFieldMap(rows) {
      const sample = rows.find((row) => row && typeof row === "object") || {};
      return {
        userField: pickField(sample, userFieldCandidates) || "user_id",
        timeField: pickField(sample, timeFieldCandidates) || "visited_at"
      };
    }

    async function fetchVisits() {
      const { data, error } = await sb
        .from("visits")
        .select("*")
        .order("id", { ascending: true });
      if (error) throw error;
      return data || [];
    }

    // ---------- 统计计算 ----------
    function buildStats(rows) {
      const fields = getFieldMap(rows);
      const todayRange = getDayRangeLocal(0);
      const byDay = {};

      for (let i = 6; i >= 0; i--) {
        const day = getDayRangeLocal(-i).label;
        byDay[day] = { uvSet: new Set(), pv: 0 };
      }

      const allUsers = new Set();
      const usersBeforeToday = new Set();
      const firstSeenDay = {};   // userId -> 最早出现日期
      const hourly = new Array(24).fill(0);

      rows.forEach((row) => {
        const rawTime = row[fields.timeField];
        const day = rawTime ? getLocalDayKey(rawTime) : null;
        const userId = row[fields.userField];

        if (userId) {
          const uidStr = String(userId);
          allUsers.add(uidStr);
          if (!rawTime || new Date(rawTime) < new Date(todayRange.start)) {
            usersBeforeToday.add(uidStr);
          }
          if (day && (!firstSeenDay[uidStr] || day < firstSeenDay[uidStr])) {
            firstSeenDay[uidStr] = day;
          }
        }

        if (day && byDay[day]) {
          byDay[day].pv += 1;
          if (userId) byDay[day].uvSet.add(String(userId));
        }

        if (rawTime) {
          const d = new Date(rawTime);
          if (!Number.isNaN(d.getTime())) hourly[d.getHours()] += 1;
        }
      });

      // 累计增长曲线：按用户首次出现日期计新增，逐日累加
      const newUsersByDay = {};
      Object.values(firstSeenDay).forEach((day) => {
        newUsersByDay[day] = (newUsersByDay[day] || 0) + 1;
      });
      const growthDays = Object.keys(newUsersByDay).sort();
      let cum = 0;
      const cumulativeSeries = growthDays.map((day) => {
        cum += newUsersByDay[day];
        return { day, total: cum, added: newUsersByDay[day] };
      });

      return {
        fields,
        dauToday: byDay[todayRange.label] ? byDay[todayRange.label].uvSet.size : 0,
        pvToday: byDay[todayRange.label] ? byDay[todayRange.label].pv : 0,
        totalUsers: allUsers.size,
        totalUntilYesterday: usersBeforeToday.size,
        trend: Object.keys(byDay).sort().map((day) => ({
          day,
          uv: byDay[day].uvSet.size,
          pv: byDay[day].pv
        })),
        cumulativeSeries,
        hourly
      };
    }

    // ---------- SVG 图表渲染 ----------
    function svgLineChart({ width = 640, height = 220, labels, series, singleAxis = true }) {
      const padding = { top: 18, right: 16, bottom: 30, left: 38 };
      const w = width - padding.left - padding.right;
      const h = height - padding.top - padding.bottom;
      const maxVal = Math.max(1, ...series.flatMap((s) => s.values));
      const n = labels.length;
      const stepX = n > 1 ? w / (n - 1) : 0;
      const xAt = (i) => padding.left + stepX * i;
      const yAt = (v) => padding.top + h - (v / maxVal) * h;

      let grid = "";
      const gridCount = 4;
      for (let g = 0; g <= gridCount; g++) {
        const gv = (maxVal * g) / gridCount;
        const gy = yAt(gv);
        grid += `<line x1="${padding.left}" y1="${gy}" x2="${width - padding.right}" y2="${gy}" stroke="#eef4ff" stroke-width="1"/>`;
        grid += `<text x="${padding.left - 8}" y="${gy + 4}" font-size="11" fill="#9aa5b1" text-anchor="end">${Math.round(gv)}</text>`;
      }

      let xLabels = "";
      const labelStep = Math.max(1, Math.ceil(n / 7));
      labels.forEach((lab, i) => {
        if (i % labelStep === 0 || i === n - 1) {
          xLabels += `<text x="${xAt(i)}" y="${height - padding.bottom + 18}" font-size="11" fill="#9aa5b1" text-anchor="middle">${lab.slice(5)}</text>`;
        }
      });

      let paths = "";
      series.forEach((s) => {
        const pts = s.values.map((v, i) => `${xAt(i)},${yAt(v)}`).join(" ");
        if (s.area) {
          const areaPts = `${xAt(0)},${yAt(0)} ${pts} ${xAt(n - 1)},${yAt(0)}`;
          paths += `<polygon points="${areaPts}" fill="${s.color}" opacity="0.10"/>`;
        }
        paths += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
        s.values.forEach((v, i) => {
          paths += `<circle cx="${xAt(i)}" cy="${yAt(v)}" r="3.5" fill="#fff" stroke="${s.color}" stroke-width="2"><title>${labels[i]} · ${s.name}: ${fmt(v)}</title></circle>`;
        });
      });

      return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" style="min-width:${Math.max(420, n * 46)}px">${grid}${paths}${xLabels}</svg>`;
    }

    function svgBarChart({ width = 640, height = 200, labels, values, color = "#3b82f6" }) {
      const padding = { top: 14, right: 12, bottom: 26, left: 34 };
      const w = width - padding.left - padding.right;
      const h = height - padding.top - padding.bottom;
      const maxVal = Math.max(1, ...values);
      const n = labels.length;
      const stepX = w / n;
      const barW = Math.max(3, stepX * 0.55);

      let grid = "";
      const gridCount = 3;
      for (let g = 0; g <= gridCount; g++) {
        const gv = (maxVal * g) / gridCount;
        const gy = padding.top + h - (gv / maxVal) * h;
        grid += `<line x1="${padding.left}" y1="${gy}" x2="${width - padding.right}" y2="${gy}" stroke="#eef4ff" stroke-width="1"/>`;
        grid += `<text x="${padding.left - 6}" y="${gy + 4}" font-size="10" fill="#9aa5b1" text-anchor="end">${Math.round(gv)}</text>`;
      }

      let bars = "";
      values.forEach((v, i) => {
        const bh = (v / maxVal) * h;
        const bx = padding.left + stepX * i + (stepX - barW) / 2;
        const by = padding.top + h - bh;
        bars += `<rect x="${bx}" y="${by}" width="${barW}" height="${Math.max(0, bh)}" rx="3" fill="${color}" opacity="${v > 0 ? 0.85 : 0.15}"><title>${labels[i]}: ${fmt(v)} 次访问</title></rect>`;
        if (i % 2 === 0) {
          bars += `<text x="${padding.left + stepX * i + stepX / 2}" y="${height - padding.bottom + 16}" font-size="10" fill="#9aa5b1" text-anchor="middle">${labels[i]}</text>`;
        }
      });

      return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${grid}${bars}</svg>`;
    }

    function renderTrendChart(trend) {
      const el = $("trendChart");
      if (!trend.some((r) => r.uv > 0 || r.pv > 0)) {
        el.innerHTML = `<div class="empty-chart">最近 7 天暂无访问数据</div>`;
        return;
      }
      const labels = trend.map((r) => r.day);
      el.innerHTML = svgLineChart({
        labels,
        series: [
          { name: "UV", color: "#3b82f6", values: trend.map((r) => r.uv), area: true },
          { name: "PV", color: "#f59e0b", values: trend.map((r) => r.pv) }
        ]
      });
    }

    function renderGrowthChart(series) {
      const el = $("growthChart");
      const pill = $("growthPill");
      if (!series.length) {
        el.innerHTML = `<div class="empty-chart">暂无用户数据</div>`;
        pill.textContent = "--";
        return;
      }
      const labels = series.map((r) => r.day);
      el.innerHTML = svgLineChart({
        width: Math.max(640, series.length * 40),
        labels,
        series: [{ name: "累计用户", color: "#8b5cf6", values: series.map((r) => r.total), area: true }]
      });
      const first = series[0], last = series[series.length - 1];
      pill.textContent = `${labels.length} 天内从 ${first.total} 增长到 ${last.total} 人`;
    }

    function renderHourChart(hourly) {
      const el = $("hourChart");
      const insight = $("hourInsight");
      const total = hourly.reduce((a, b) => a + b, 0);
      if (total === 0) {
        el.innerHTML = `<div class="empty-chart">暂无访问数据</div>`;
        insight.style.display = "none";
        return;
      }
      const labels = hourly.map((_, h) => `${h}`.padStart(2, "0"));
      el.innerHTML = svgBarChart({ labels, values: hourly, color: "#3b82f6" });

      const maxHour = hourly.indexOf(Math.max(...hourly));
      const rangeStart = String(maxHour).padStart(2, "0");
      const rangeEnd = String((maxHour + 1) % 24).padStart(2, "0");
      insight.style.display = "block";
      insight.textContent = `访问高峰出现在 ${rangeStart}:00–${rangeEnd}:00，占全部访问的 ${((Math.max(...hourly) / total) * 100).toFixed(1)}%`;
    }

    async function loadDashboard() {
      clearErr();
      clearWarn();
      $("lastUpdated").textContent = "正在加载访问数据...";

      try {
        const visits = await fetchVisits();

        if (visits.length === 0) {
          showWarn(
            "查询成功，但 visits 表返回了 0 条数据（没有报错）。\n" +
            "这种情况几乎总是因为 Supabase 的 RLS 还没有为 SELECT 开放权限：\n" +
            "网站首页用同一把 key 能 insert 成功，只代表 INSERT 策略是开的，\n" +
            "看板需要的是单独的 SELECT 策略。\n\n" +
            "去 Supabase 后台 SQL Editor 执行：\n" +
            "create policy \"allow public read for dashboard\"\n" +
            "on public.visits for select using (true);"
          );
        }

        const stats = buildStats(visits);

        $("dauToday").textContent = fmt(stats.dauToday);
        $("pvToday").textContent = fmt(stats.pvToday);
        $("totalUsers").textContent = fmt(stats.totalUsers);
        $("totalUntilYesterday").textContent = fmt(stats.totalUntilYesterday);

        renderTrendChart(stats.trend);
        renderGrowthChart(stats.cumulativeSeries);
        renderHourChart(stats.hourly);

        const t = new Date();
        $("lastUpdated").textContent = `最后更新：${t.toLocaleString("zh-CN")}（本地时区） · 数据来源：visits 表`;
      } catch (e) {
        console.error(e);
        showErr(
          "加载失败，常见原因：\n" +
          "1) visits 表未开放 SELECT RLS 策略\n" +
          "2) 字段名不是 user_id / visited_at（或 created_at）\n" +
          "3) key 或 project URL 不对应\n\n" +
          "错误详情：\n" + (e?.message || JSON.stringify(e))
        );
        $("lastUpdated").textContent = "加载失败";
      }
    }

    $("refreshBtn").addEventListener("click", loadDashboard);
    loadDashboard();
    setInterval(loadDashboard, 60 * 1000); // 每分钟自动刷新一次
  </script>
</body>
</html>
